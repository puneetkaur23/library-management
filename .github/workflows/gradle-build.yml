
# ==========================================
# CI/CD PIPELINE FOR LIBRARY MANAGEMENT APPLICATION
# ==========================================

# Name displayed in the GitHub Actions tab
name: Gradle Build & Test

# ==========================================
# TRIGGERS
# Defines when the workflow should execute
# ==========================================
on:
  # Trigger workflow whenever code is pushed
  push:
    branches:
      - main          # Run when code is pushed to main
      - 'feature/**'  # Run when code is pushed to any feature branch

  # Trigger workflow whenever a Pull Request is created or updated
  pull_request:
    branches:
      - main          # Run when a PR targets the main branch

# ==========================================
# JOBS
# Defines the tasks performed by the workflow
# ==========================================
jobs:
  build:

    # Name of the job displayed on GitHub Actions
    name: Build, Test & Package

    # Specifies the virtual machine where the job runs
    # ubuntu-latest provides a Linux environment
    runs-on: ubuntu-latest

    # ==========================================
    # STEPS
    # Commands executed sequentially in the job
    # ==========================================
    steps:

      # STEP 1: CHECKOUT REPOSITORY
      # Downloads the repository source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: SET UP JAVA
      # Installs JDK 17 for compiling and running Java applications
      # Temurin is the Eclipse Adoptium distribution of OpenJDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # STEP 3: SET UP GRADLE
      # Configures Gradle and enables dependency/build caching
      # This reduces build time in future workflow executions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # STEP 4: MAKE GRADLE WRAPPER EXECUTABLE
      # Gives execution permission to gradlew on Linux
      # Required because Linux does not automatically execute the script
      - name: Make gradlew executable
        run: chmod +x gradlew

      # STEP 5: BUILD AND TEST APPLICATION
      # clean removes previous build files
      # build compiles the code, runs tests and creates the JAR
      - name: Build with Gradle
        run: ./gradlew clean build

      # STEP 6: UPLOAD TEST REPORT
      # Uploads the HTML test report as a GitHub Actions artifact
      # always() ensures the report upload is attempted even if
      # the build or test step fails
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/

      # STEP 7: UPLOAD JACOCO COVERAGE REPORT
      # JaCoCo measures how much of the application code
      # is executed during testing
      # Uploads the generated HTML coverage report
      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      # STEP 8: UPLOAD FAT JAR
      # Uploads the packaged application JAR file
      # success() ensures this step runs only if previous steps succeed
      # The fat JAR contains the application and its dependencies
      - name: Upload Fat JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: library-management-jar
          path: build/libs/library-management-1.0.0-all.jar

# ==========================================
# END OF CI/CD PIPELINE
# ==========================================
