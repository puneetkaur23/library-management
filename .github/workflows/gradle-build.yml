# CI/CD Pipeline for Library Management Application
# Runs on every push and pull request to ensure code quality.
# Uses Gradle wrapper for reproducible builds.

name: Gradle Build & Test

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17 (Eclipse Temurin distribution)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Set up Gradle with caching for faster builds
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Make gradlew executable (important for Linux/macOS runners)
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Step 5: Run the full build (compile, test, coverage check, jar)
      - name: Build with Gradle
        run: ./gradlew clean build

      # Step 6: Upload test report as a build artifact
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/

      # Step 7: Upload JaCoCo coverage report
      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      # Step 8: Upload the fat JAR as a build artifact
      - name: Upload Fat JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: library-management-jar
          path: build/libs/library-management-1.0.0-all.jar

