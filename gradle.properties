# Gradle properties for optimizing builds
# These are read automatically by Gradle at startup.

# Enable the Gradle build cache to reuse outputs from previous builds.
# Speeds up incremental builds significantly.
org.gradle.caching=true

# Enable parallel project execution for multi-module builds.
# Even for single-module projects, this doesn't hurt.
org.gradle.parallel=true

# Set the JVM arguments for the Gradle daemon.
# -Xmx512m: Maximum heap size (sufficient for small projects)
# -Dfile.encoding=UTF-8: Ensure consistent character encoding
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8

